<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuri Studio | Salon, Spa & Barbershop in Nairobi</title>
<meta name="description" content="Haircuts, braids, facials and massage. Pick your services and book on WhatsApp in under a minute.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--plum:#2B1634;--orchid:#B5338A;--orchid-d:#8F2569;--gold:#E0A83C;--paper:#FBF6FA;--blush:#F2E4EF;--ink:#241A28;--mute:#6B5B70}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6;font-size:17px}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;line-height:1.08;letter-spacing:-.02em}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{background:var(--plum);color:#fff}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.logo{font:800 22px 'Bricolage Grotesque',sans-serif;text-decoration:none}
.logo span{color:var(--gold)}
nav a.nl{font-size:15px;text-decoration:none;opacity:.85;margin-left:18px}
nav a.nl:hover{opacity:1}
.hero{display:grid;gap:32px;padding:28px 0 56px;grid-template-columns:1fr}
.hero h1{font-size:clamp(40px,8vw,72px);font-weight:800}
.hero p.lead{margin-top:16px;max-width:46ch;opacity:.85;font-size:18px}
.stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:22px;font-size:15px;opacity:.9}
.stats b{color:var(--gold)}
.book{background:var(--paper);color:var(--ink);border-radius:20px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.book h2{font-size:24px;margin-bottom:4px}
.book .sub{color:var(--mute);font-size:15px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{font:500 15px 'DM Sans',sans-serif;border:1.5px solid #D9C3D4;background:#fff;color:var(--ink);border-radius:999px;padding:9px 14px;cursor:pointer;transition:background .15s,border-color .15s}
.chip[aria-pressed=true]{background:var(--orchid);border-color:var(--orchid);color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.book input,.book select{width:100%;font:16px 'DM Sans',sans-serif;padding:11px 12px;border:1.5px solid #D9C3D4;border-radius:10px;background:#fff;color:var(--ink)}
.book label{font-size:13px;color:var(--mute);display:block;margin-bottom:3px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 12px;font-weight:700}
.total span:last-child{font:800 26px 'Bricolage Grotesque',sans-serif;color:var(--orchid-d)}
.go{display:block;text-align:center;background:#1FA855;color:#fff;font-weight:700;text-decoration:none;padding:14px;border-radius:12px;border:0;width:100%;font-size:17px;cursor:pointer;font-family:inherit}
.go:hover{background:#188a45}
.note{font-size:13px;color:var(--mute);margin-top:8px;text-align:center}
section{padding:60px 0}
section h2{font-size:clamp(30px,5vw,44px);margin-bottom:8px}
section .intro{color:var(--mute);max-width:52ch;margin-bottom:28px}
.menu{display:grid;gap:28px;grid-template-columns:1fr}
.menu h3{font-size:22px;color:var(--orchid-d);margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--blush)}
.item{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #E2CFDD}
.item small{display:block;color:var(--mute);font-size:14px}
.item b{white-space:nowrap}
.alt{background:var(--blush)}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ph{aspect-ratio:1;border-radius:14px;display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:700;font-size:15px}
.ph:nth-child(1){background:linear-gradient(145deg,#B5338A,#2B1634)}
.ph:nth-child(2){background:linear-gradient(145deg,#E0A83C,#8F2569)}
.ph:nth-child(3){background:linear-gradient(145deg,#2B1634,#5E3A6E)}
.ph:nth-child(4)
